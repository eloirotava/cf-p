name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release (ex.: v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Validate requested version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_tag="$INPUT_VERSION"
          [[ "$release_tag" == v* ]] || release_tag="v$release_tag"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: $release_tag (use, por exemplo, v0.0.1)" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64 (static)
            target: x86_64-unknown-linux-musl
            archive: cfp-linux-amd64
            exe: ""
          - name: Linux ARM64 (static)
            target: aarch64-unknown-linux-musl
            archive: cfp-linux-arm64
            exe: ""
          - name: Linux ARMv7/armhf (static)
            target: armv7-unknown-linux-musleabihf
            archive: cfp-linux-armhf
            exe: ""
          - name: Windows x64
            target: x86_64-pc-windows-gnu
            archive: cfp-windows-amd64
            exe: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build optimized binaries
        # Um build por pacote: com `--workspace` o Cargo unifica as features, e o
        # cliente herdaria as do servidor (env-filter, tokio multi-thread),
        # desfazendo a reducao de tamanho do agente.
        run: |
          cross build --release --locked --target "${{ matrix.target }}" -p cfp-client
          cross build --release --locked --target "${{ matrix.target }}" -p cfp-server

      - name: Package binaries
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euxo pipefail
          mkdir -p "dist/$ARCHIVE"
          cp "target/$TARGET/release/cfp-client$EXE" "dist/$ARCHIVE/"
          cp "target/$TARGET/release/cfp-server$EXE" "dist/$ARCHIVE/"
          cp README.md server.example.yaml "dist/$ARCHIVE/"
          if [[ -z "$EXE" ]]; then
            tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
            sha256sum "dist/$ARCHIVE.tar.gz" > "dist/$ARCHIVE.tar.gz.sha256"
          else
            (cd dist && zip -r "$ARCHIVE.zip" "$ARCHIVE")
            sha256sum "dist/$ARCHIVE.zip" > "dist/$ARCHIVE.zip.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/${{ matrix.archive }}.tar.gz
            dist/${{ matrix.archive }}.tar.gz.sha256
            dist/${{ matrix.archive }}.zip
            dist/${{ matrix.archive }}.zip.sha256
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: cf-p ${{ needs.prepare.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
