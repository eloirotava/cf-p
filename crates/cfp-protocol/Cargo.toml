[package]
name = "cfp-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# A ponte entre socket local e stream do tunel mora aqui para existir uma
# implementacao so do controle de fluxo. As features sao um subconjunto do que
# cliente e servidor ja habilitam, entao nada novo entra no binario.
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "sync"] }
